#cloud-config
ssh_pwauth: false
# Host Image apt indexes are enough to install podman; skip apt-get update on
# create (faster Park->Apply). Revisit when Prefect leaves dev-only.
package_update: false
packages:
  - podman
users:
  - name: prefect
    lock_passwd: true
    shell: /bin/bash
# Apply port floor before packages/runcmd so early Edge install cannot race (ADR-0006).
bootcmd:
  - [ sysctl, -w, net.ipv4.ip_unprivileged_port_start=80 ]
write_files:
  - path: /etc/sysctl.d/99-unprivileged-port-start.conf
    content: |
      net.ipv4.ip_unprivileged_port_start=80
  # Linger file in config stage so Prefect User linger holds even if DigitalOcean
  # vendor scripts fail in final and skip scripts_user / runcmd (ADR-0008).
  - path: /var/lib/systemd/linger/prefect
    content: ""
    permissions: "0644"
mounts:
  - [ /dev/disk/by-id/scsi-0DO_Volume_${volume_name}, /var/lib/prefect, ext4, "defaults,nofail,discard,noatime", "0", "2" ]
runcmd:
  - sysctl --system
  - loginctl enable-linger prefect
  # Volume attaches via a Recreatable relationship after Host create; wait then mount.
  - |
    vol=/dev/disk/by-id/scsi-0DO_Volume_${volume_name}
    for i in $(seq 1 90); do
      if [ -e "$vol" ]; then
        mount /var/lib/prefect || mount "$vol" /var/lib/prefect || true
        break
      fi
      sleep 2
    done
