worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;
    sendfile      on;
    keepalive_timeout 65;

    # Empty Edge: ACME HTTP-01 on :80; everything else is a real HTTP 404 (ADR-0007 / ADR-0013).
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
            default_type text/plain;
        }

        location / {
            return 404;
        }
    }

    # Domain fronts (Edge-owned TLS servers + /healthcheck + :80 redirect). ADR-0028.
    include /etc/nginx/prefect-domains/*.conf;
    # Workload Routes (operator-authored). Full-server fixtures remain until follow-on rewrite.
    include /etc/nginx/prefect-routes/*.conf;
}
